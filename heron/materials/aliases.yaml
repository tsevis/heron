# VLM / open-vocabulary label -> material-table class (CLAUDE.md §7).
#
# Grounding-DINO / SAM taggers and the Ollama VLM return free-text labels;
# this maps them onto the curated seed classes in table.yaml. Matching is
# case-insensitive and substring-based (see materials/loader.py), so "cotton
# t-shirt" resolves via "shirt" -> fabric. Add liberally; keep table.yaml lean.

