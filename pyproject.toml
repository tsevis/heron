[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heron"
version = "0.2.0"
description = "Physically-grounded radiometric imaging engine (thermography, X-ray, Kirlian, Schlieren, night vision, spectroscopy)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ai = ["torch>=2.2", "transformers>=4.40", "onnxruntime>=1.17", "mediapipe>=0.10"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
heron = "heron.cli:app"

[tool.setuptools.packages.find]
include = ["heron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The suite imports `heron` AND `webapp` as top-level packages from the repo
# root. `pip install -e .` only covers the first -- packages.find is scoped to
# `heron*` -- and nothing put the root on sys.path, so `webapp` never
# resolved. The green runs came from `python -m pytest`, which prepends the
# working directory: a side effect, not a declaration. Plain `pytest` gave 22
# collection errors, 21 of them `No module named 'heron'` and one
# `No module named 'webapp'`.
pythonpath = ["."]

# `local` marks a test that asserts something about THIS MACHINE rather than
# about the code: that the model weights are already downloaded here, for
# instance. Such a test is a useful desktop diagnostic and cannot ever pass on
# a fresh runner, so CI excludes it BY NAME rather than letting it fail there
# forever or skip there silently. A plain local `pytest` still runs it, which
# is the only place it means anything.
markers = [
    "local: asserts a fact about this machine, not the code; excluded in CI",
]
